<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <meta name="description" content="How to work with tables in html">
    <meta name="author" content="Gustavo da Silva Pereira">
    <link rel="stylesheet" href="style/table.css">
</head>

<body>
    <table>
        <caption>
            dinosaurs in the jurassic period
        </caption>
        <colgroup>
            <col>
            <col span="2" class="plant">
            <col span="2" class="meat">
        </colgroup>
        <thead>
            <td></td>
            <th scope="col">Stegosaurus</th>
            <th scope="col">Brachiosaurus</th>
            <th scope="col">Allosaurus</th>
            <th scope="col">Dilophosaurus</th>
        </thead>
        <tbody>
            <tr>
                <th scope="row">Skills</th>
                <td>Whiplash Defense</td>
                <td>High-Reach Foraging</td>
                <td>Axe-Striking</td>
                <td>Pack Stalking</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
