<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review</title>

    <meta name="description" content="Product review form for WDD 131.">
    <meta name="author" content="Gustavo da Silva Pereira">

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>

                <label for="rating1">
                    <input type="radio" id="rating1" name="rating" value="1" required>
                    ☆
                </label>

                <label for="rating2">
                    <input type="radio" id="rating2" name="rating" value="2">
                    ☆☆
                </label>

                <label for="rating3">
                    <input type="radio" id="rating3" name="rating" value="3">
                    ☆☆☆
                </label>

                <label for="rating4">
                    <input type="radio" id="rating4" name="rating" value="4">
                    ☆☆☆☆
                </label>

                <label for="rating5">
                    <input type="radio" id="rating5" name="rating" value="5">
                    ☆☆☆☆☆
                </label>
            </fieldset>

            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful Features</legend>

                <label for="feature1">
                    <input type="checkbox" id="feature1" name="features" value="easy">
                    Easy to use
                </label>

                <label for="feature2">
                    <input type="checkbox" id="feature2" name="features" value="durable">
                    Durable
                </label>

                <label for="feature3">
                    <input type="checkbox" id="feature3" name="features" value="design">
                    Good design
                </label>

                <label for="feature4">
                    <input type="checkbox" id="feature4" name="features" value="performance">
                    Good performance
                </label>
            </fieldset>

            <label for="review">Written Review <span>(Optional)</span></label>
            <textarea id="review" name="review"></textarea>

            <label for="userName">Your Name <span>(Optional)</span></label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>
            &copy;<span id="currentyear"></span> Gustavo da Silva Pereira | Amazonas, Brazil
        </p>
        <p>
            Last Modified:
            <span id="lastModified"></span>
        </p>
    </footer>

</body>
</html>
